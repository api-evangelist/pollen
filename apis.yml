aid: pollen
name: Pollen
description: >-
  Pollen Technologies is a London-based, FCA-authorised white-label fintech
  platform that lets any business launch its own banking and payments product
  with no code and a fully managed back office. The platform delivers
  programmatic payment delivery, instant named IBAN account opening, third-party
  bank account linking for real-time balances and transaction data, multi-currency
  payments across 148 currencies into more than 160 countries, local payment
  schemes, and virtual and physical cards. A managed compliance layer covers KYC,
  AML, transaction monitoring, client fund safeguarding and help-desk support
  under SLAs. Pollen Technologies Ltd is authorised by the Financial Conduct
  Authority under the Payment Services Regulations 2017 (firm reference 768011),
  founded in 2015 and backed by Seedcamp, Level39 and Q-Advisers. Access to the
  underlying payments and banking APIs is delivered as a managed, partner-only
  service rather than a public self-serve developer program, so no public API
  specifications, SDKs or developer portal are currently published.
